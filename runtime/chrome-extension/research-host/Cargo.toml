[package]
name = "latex-local-research"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Device-local research settings and confined Python/R scripts and Jupyter sessions under a macOS deny-default sandbox"

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.177"
serde_json = "=1.0.154"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
