[package]
name = "latex-local-host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
base64 = "=0.22.1"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
libc = "=0.2.177"
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
